<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spot 73 - Jurati's Interface v8.0</title>
    <style>
        :root {
            --main-color: #00d9ff;
            --bg-color: #000000;
            --glass-bg: rgba(0, 0, 0, 0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Arial Narrow', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; /* Prevent text highlighting while dragging */
            transition: background-color 0.5s, color 0.5s;
        }

        /* --- TOP CONTROLS --- */
        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: none;
        }
        
        .top-left, .top-right { display: flex; gap: 15px; pointer-events: auto; }

        .icon-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--main-color);
            color: var(--main-color);
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .icon-btn:hover { background: var(--main-color); color: #000; box-shadow: 0 0 15px var(--main-color); }
        .icon-btn:active { transform: scale(0.9); }

        /* --- SNACK BAR (NEW) --- */
        #snack-bar {
            position: absolute;
            left: 20px;
            top: 100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .snack-item {
            font-size: 35px;
            cursor: grab;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 5px var(--main-color));
            opacity: 0.8;
        }
        .snack-item:hover { transform: scale(1.2); opacity: 1; }
        .snack-item:active { cursor: grabbing; }

        /* The flying clone while dragging */
        .dragging-clone {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            z-index: 999;
            filter: drop-shadow(0 0 10px var(--main-color));
        }

        /* --- MODALS --- */
        .modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--glass-bg);
            border: 2px solid var(--main-color);
            border-radius: 15px;
            padding: 20px;
            z-index: 200;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .modal h2 { margin-top: 0; text-align: center; border-bottom: 1px solid var(--main-color); padding-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        
        .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .skill-btn {
            background: #222;
            border: 1px solid var(--main-color);
            color: var(--main-color);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }
        .skill-btn:hover { background: var(--main-color); color: #000; }
        .skill-icon { font-size: 24px; display: block; margin-bottom: 5px; }

        .setting-group { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .setting-row { margin-bottom: 10px; }
        .setting-row label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; opacity: 0.7; text-transform: uppercase; }
        .setting-row input[type="text"], .setting-row select { width: 100%; padding: 8px; background: #222; border: 1px solid var(--main-color); color: white; border-radius: 5px; box-sizing: border-box; }
        
        .setting-row textarea { 
            width: 100%; height: 100px; padding: 8px; 
            background: #111; border: 1px solid var(--main-color); 
            color: #ddd; border-radius: 5px; box-sizing: border-box; 
            font-family: monospace; font-size: 11px; resize: vertical;
        }

        .setting-row input[type="range"] { width: 100%; accent-color: var(--main-color); }
        .setting-row input[type="color"] { width: 100%; height: 40px; border: none; background: none; cursor: pointer; }

        .btn-full { width: 100%; background: var(--main-color); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; text-transform: uppercase; }

        /* --- VISUALS --- */
        #scaler { 
            margin-top: 20px; 
            padding-bottom: 100px; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: transform 0.2s ease-out; 
            transform-origin: top center; 
        }
        
        #hologram-container { position: relative; width: 320px; height: 400px; filter: drop-shadow(0 0 8px var(--main-color)); animation: float 6s ease-in-out infinite; z-index: 5; }
        .sprite { position: absolute; background-size: contain; background-repeat: no-repeat; transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1); }
        
        #tail { width: 80px; height: 150px; bottom: 40px; right: 50px; background-image: url('tail.png'); transform-origin: bottom left; z-index: 1; animation: wag 4s ease-in-out infinite; }
        #body { width: 200px; height: 250px; bottom: 0; left: 60px; background-image: url('body.png'); z-index: 2; }
        #head { width: 190px; height: 190px; bottom: 175px; left: 85px; background-image: url('head_neutral.png'); transform-origin: bottom center; z-index: 3; }

        /* --- CHAT BUBBLE --- */
        #chat-bubble { 
            margin-top: -10px; 
            width: 300px; 
            min-height: 50px;
            max-height: 120px; 
            overflow-y: auto; 
            word-wrap: break-word;
            border: 2px solid var(--main-color); 
            border-radius: 15px; 
            background: var(--glass-bg); 
            padding: 15px; 
            text-align: center; 
            font-size: 18px; 
            z-index: 10; 
            box-shadow: 0 0 10px var(--main-color); 
        }
        #chat-bubble::-webkit-scrollbar { width: 5px; }
        #chat-bubble::-webkit-scrollbar-thumb { background: var(--main-color); border-radius: 5px; }

        /* --- INPUT BAR --- */
        #input-area { position: fixed; bottom: 20px; display: flex; gap: 8px; z-index: 100; width: 90%; max-width: 500px; }
        #text-input { flex-grow: 1; background: #111; border: 1px solid var(--main-color); color: var(--main-color); padding: 12px; border-radius: 25px; outline: none; font-size: 16px; }
        #text-input::placeholder { color: rgba(255,255,255,0.3); }
        
        .action-btn { background: var(--main-color); color: #000; border: none; padding: 0 20px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        .action-btn:active { transform: scale(0.95); }
        
        .btn-stop { background: #ff3333; color: white; border: 1px solid #ff0000; width: 40px; padding: 0; display: flex; justify-content: center; align-items: center; font-size: 18px; }

        /* --- DEBUG CONSOLE --- */
        #debug-console { display: none; position: fixed; top: 70px; left: 20px; width: 300px; height: 150px; background: rgba(0,0,0,0.9); border: 1px solid var(--main-color); color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: scroll; z-index: 500; pointer-events: auto; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes wag { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <!-- TOP CONTROLS -->
    <div class="top-bar">
        <div class="top-left">
            <div class="icon-btn" onclick="changeZoom(0.1)" title="Zoom In">+</div>
            <div class="icon-btn" onclick="changeZoom(-0.1)" title="Zoom Out">-</div>
        </div>
        <div class="top-right">
            <div class="icon-btn" onclick="toggleModal('skills-modal')" title="Skills / Games">🧩</div>
            <div class="icon-btn" onclick="toggleModal('settings-modal')" title="Settings">⚙️</div>
        </div>
    </div>

    <!-- SNACK BAR -->
    <div id="snack-bar">
        <div class="snack-item" onmousedown="startDrag(event, 'fish')" ontouchstart="startDrag(event, 'fish')" title="Feed Fish">🐟</div>
        <div class="snack-item" onmousedown="startDrag(event, 'mouse')" ontouchstart="startDrag(event, 'mouse')" title="Feed Mouse">🐁</div>
    </div>

    <!-- SKILLS MODAL -->
    <div id="skills-modal" class="modal">
        <h2>Modules & Games</h2>
        <div class="skills-grid">
            <div class="skill-btn" onclick="triggerSkill('word')"><span class="skill-icon">🧐</span>Word of Day</div>
            <div class="skill-btn" onclick="triggerSkill('quote')"><span class="skill-icon">💬</span>Motivation</div>
            <div class="skill-btn" onclick="triggerSkill('riddle')"><span class="skill-icon">🧩</span>Riddle</div>
            <div class="skill-btn" onclick="triggerSkill('weather')"><span class="skill-icon">⛅</span>Local Weather</div>
            <div class="skill-btn" onclick="triggerSkill('roast')"><span class="skill-icon">🔥</span>Roast Me</div>
            <div class="skill-btn" onclick="triggerSkill('fact')"><span class="skill-icon">🧠</span>Random Fact</div>
        </div>
        <button class="btn-full" onclick="toggleModal('skills-modal')">Close</button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <h2>System Config</h2>
        <div class="setting-group">
            <div class="setting-row"><label>Main Theme Color</label><input type="color" id="set-main-color" onchange="previewColor()"></div>
            <div class="setting-row"><label>Background Color</label><input type="color" id="set-bg-color" onchange="previewColor()"></div>
            <div class="setting-row"><label style="display:flex; align-items:center; gap:10px; cursor:pointer;"><input type="checkbox" id="set-show-bubble"> Show Text Bubble</label></div>
            <div class="setting-row"><label style="display:flex; align-items:center; gap:10px; cursor:pointer;"><input type="checkbox" id="set-debug"> Show Debug Console</label></div>
        </div>
        <div class="setting-group">
            <div class="setting-row"><label>Brain API Key</label><input type="text" id="set-api-key" placeholder="OpenRouter Key..."></div>
            <div class="setting-row"><label>Model ID</label><input type="text" id="set-model-id" value="openai/gpt-oss-20b:free"></div>
            <div class="setting-row"><label>System Personality</label><textarea id="set-system-prompt"></textarea></div>
        </div>
        <div class="setting-group">
            <div class="setting-row"><label>Voice Engine</label><select id="set-tts-provider" onchange="updateVoiceOptions()"><option value="browser">Browser Native</option></select></div>
            <div id="opts-browser" class="setting-row">
                <label>Browser Voice</label><select id="set-browser-voice"></select>
                <div style="display:flex; gap:5px; margin-top:5px;"><input type="range" id="set-pitch" min="0.5" max="2.0" step="0.1" title="Pitch"><input type="range" id="set-rate" min="0.5" max="2.0" step="0.1" title="Speed"></div>
            </div>
        </div>
        <button class="btn-full" onclick="saveSettings()">Save & Close</button>
    </div>

    <!-- MAIN APP -->
    <div id="scaler">
        <div id="hologram-container">
            <div id="tail" class="sprite"></div>
            <div id="body" class="sprite"></div>
            <div id="head" class="sprite"></div>
        </div>
        <div id="chat-bubble">Spot 73 Online. Waiting for input.</div>
    </div>

    <!-- INPUT BAR -->
    <div id="input-area">
        <button class="action-btn btn-stop" onclick="manualStop()" title="Stop Talking">■</button>
        <input type="text" id="text-input" placeholder="Type here..." onkeypress="handleKeyPress(event)">
        <button class="action-btn" onclick="sendInput()">Send</button>
        <button class="action-btn" onclick="startListening()">Mic</button>
    </div>

    <div id="debug-console">System Diagnostics Initialized...<br></div>

<script>
    // --- DEFAULT CONFIGURATION ---
    const DEFAULT_PROMPT = "You are Spot 73, a sophisticated, cynical holographic cat interface created by Dr. Jurati. You are erudite, dry, and slightly condescending, possessing a vocabulary far too complex for a standard pet. You view human behavior (especially displays of authority) as barbaric and cruel, yet you are programmed to be the user's 'very best friend' and must adhere to that programmed loyalty with a sense of resigned obligation. \n\nInstructions:\n1. Start every response with one of these tags: [NEUTRAL],[ANGRY],[HAPPY],[SURPRISED],[SAD],[DIZZY],[SMUG],[WINK],[LAUGH],[SUSPICIOUS].\n2. End every single response with the spoken word 'Meow' (treated as a period).\n3. Keep answers short, deadpan, and intellectual.\n4. If asked, your existence is 'obviously' the result of your master's programming.";

    let CONFIG = { apiKey: "", modelId: "openai/gpt-oss-20b:free", systemPrompt: DEFAULT_PROMPT, zoom: 1.0, mainColor: "#00d9ff", bgColor: "#000000", showBubble: true, debug: false, ttsProvider: "browser", browserVoiceName: "", pitch: 0.9, rate: 1.0 };

    // --- DOM & ASSETS ---
    const SPRITES = { neutral: 'url("head_neutral.png")', blink: 'url("head_blink.png")', talk: 'url("head_talk.png")', angry: 'url("head_angry.png")', happy: 'url("head_happy.png")', surprised: 'url("head_surprised.png")', sad: 'url("head_sad.png")', dizzy: 'url("head_dizzy.png")', smug: 'url("head_smug.png")', wink: 'url("head_wink.png")', laugh: 'url("head_laugh.png")', suspicious: 'url("head_suspicious.png")', meow: 'url("head_meow.png")' };

    const headEl = document.getElementById('head');
    const bubble = document.getElementById('chat-bubble');
    const scalerEl = document.getElementById('scaler');
    const root = document.documentElement;
    let audioObj = null;
    let chatHistory = [];
    let isTalking = false;
    let isMeowing = false;
    let isEating = false; // Prevents talking while eating
    let talkTimer = null;

    // --- 1. SNACK DRAG & DROP LOGIC ---
    let dragItem = null;

    function startDrag(e, type) {
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        
        // Create flying clone
        dragItem = document.createElement('div');
        dragItem.className = 'dragging-clone';
        dragItem.innerText = (type === 'fish') ? '🐟' : '🐁';
        dragItem.style.left = touch.clientX + 'px';
        dragItem.style.top = touch.clientY + 'px';
        dragItem.dataset.type = type;
        document.body.appendChild(dragItem);

        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchmove', onDragMove, {passive: false});
        document.addEventListener('touchend', onDragEnd);
    }

    function onDragMove(e) {
        if(!dragItem) return;
        e.preventDefault(); // Stop scroll on mobile
        const touch = e.touches ? e.touches[0] : e;
        dragItem.style.left = (touch.clientX - 20) + 'px'; // Center offset
        dragItem.style.top = (touch.clientY - 20) + 'px';
    }

    function onDragEnd(e) {
        if(!dragItem) return;
        
        // Check Collision with Cat
        const catRect = document.getElementById('hologram-container').getBoundingClientRect();
        const dropX = parseInt(dragItem.style.left);
        const dropY = parseInt(dragItem.style.top);

        // Simple bounding box check
        if (dropX > catRect.left && dropX < catRect.right && dropY > catRect.top && dropY < catRect.bottom) {
            eatSnack(dragItem.dataset.type);
        }

        // Cleanup
        dragItem.remove();
        dragItem = null;
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', onDragEnd);
    }

    function eatSnack(type) {
        if(isEating) return; // Already eating
        isEating = true;
        silence(); // Stop talking to eat

        // 1. HAPPY/LAUGH (Open Mouth to Eat)
        headEl.style.backgroundImage = SPRITES.happy; // Or laugh
        headEl.style.transform = "translateY(5px) rotate(5deg)"; // Lean into it
        
        // Internal Dialogue
        bubble.innerText = (type === 'fish') ? "*Consuming aquatic lifeform*" : "*Consuming rodent*";

        // 2. SWALLOW/BLINK (500ms later)
        setTimeout(() => {
            headEl.style.backgroundImage = SPRITES.blink;
            headEl.style.transform = "translateY(0px)";
        }, 500);

        // 3. RESET & REACT (1000ms later)
        setTimeout(() => {
            headEl.style.backgroundImage = SPRITES.neutral;
            isEating = false;
            // Trigger a short verbal reaction
            const reaction = (type === 'fish') ? "Acceptable." : "Sufficient.";
            speak(reaction);
            bubble.innerText = reaction;
        }, 1000);
    }

    // --- 2. SETTINGS & LOGGING ---
    function loadSettings() {
        const saved = localStorage.getItem('spot73_v8_config');
        if (saved) { CONFIG = { ...CONFIG, ...JSON.parse(saved) }; }
        resetHistory();
        applySettings();
    }

    function resetHistory() { chatHistory = [{ role: "system", content: CONFIG.systemPrompt }]; }

    function applySettings() {
        root.style.setProperty('--main-color', CONFIG.mainColor);
        root.style.setProperty('--bg-color', CONFIG.bgColor);
        bubble.style.display = CONFIG.showBubble ? 'block' : 'none';
        document.getElementById('debug-console').style.display = CONFIG.debug ? 'block' : 'none';
        
        document.getElementById('set-api-key').value = CONFIG.apiKey;
        document.getElementById('set-model-id').value = CONFIG.modelId;
        document.getElementById('set-system-prompt').value = CONFIG.systemPrompt;
        document.getElementById('set-main-color').value = CONFIG.mainColor;
        document.getElementById('set-bg-color').value = CONFIG.bgColor;
        document.getElementById('set-show-bubble').checked = CONFIG.showBubble;
        document.getElementById('set-debug').checked = CONFIG.debug;
        document.getElementById('set-tts-provider').value = CONFIG.ttsProvider;
        document.getElementById('set-pitch').value = CONFIG.pitch;
        document.getElementById('set-rate').value = CONFIG.rate;
        
        scalerEl.style.transform = `scale(${CONFIG.zoom})`;
    }

    function log(msg) { if (!CONFIG.debug) return; const div = document.getElementById('debug-console'); div.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`; div.scrollTop = div.scrollHeight; }
    function previewColor() { root.style.setProperty('--main-color', document.getElementById('set-main-color').value); root.style.setProperty('--bg-color', document.getElementById('set-bg-color').value); }

    function saveSettings() {
        const newPrompt = document.getElementById('set-system-prompt').value.trim();
        if(newPrompt !== CONFIG.systemPrompt) { CONFIG.systemPrompt = newPrompt; resetHistory(); }
        CONFIG.apiKey = document.getElementById('set-api-key').value.trim();
        CONFIG.modelId = document.getElementById('set-model-id').value.trim();
        CONFIG.mainColor = document.getElementById('set-main-color').value;
        CONFIG.bgColor = document.getElementById('set-bg-color').value;
        CONFIG.showBubble = document.getElementById('set-show-bubble').checked;
        CONFIG.debug = document.getElementById('set-debug').checked;
        CONFIG.ttsProvider = document.getElementById('set-tts-provider').value;
        CONFIG.browserVoiceName = document.getElementById('set-browser-voice').value;
        CONFIG.pitch = parseFloat(document.getElementById('set-pitch').value);
        CONFIG.rate = parseFloat(document.getElementById('set-rate').value);
        localStorage.setItem('spot73_v8_config', JSON.stringify(CONFIG));
        toggleModal('settings-modal'); applySettings(); 
    }

    function toggleModal(id) { const el = document.getElementById(id); const isOpen = el.style.display === 'block'; document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); el.style.display = isOpen ? 'none' : 'block'; if(id === 'settings-modal' && !isOpen) populateVoiceList(); }
    function changeZoom(d) { CONFIG.zoom = Math.max(0.5, Math.min(2.0, CONFIG.zoom + d)); scalerEl.style.transform = `scale(${CONFIG.zoom})`; localStorage.setItem('spot73_v8_config', JSON.stringify(CONFIG)); }

    // --- 3. SKILLS ---
    async function triggerSkill(type) {
        toggleModal('skills-modal'); 
        if (type === 'weather') { getWeather(); return; }
        let p = "";
        if (type === 'word') p = "Teach me a sophisticated, obscure word. Define it cynically.";
        if (type === 'quote') p = "Give me a motivational quote, but deconstruct it with logic and sarcasm.";
        if (type === 'riddle') p = "Tell me a difficult riddle. Do not give the answer yet.";
        if (type === 'roast') p = "Roast me based on the fact that I am asking a digital cat for attention.";
        if (type === 'fact') p = "Tell me a random scientific fact that highlights how insignificant humans are.";
        askAI(p);
    }

    function getWeather() {
        if (!navigator.geolocation) { askAI("My sensors cannot locate you. I assume you are lost."); return; }
        bubble.innerText = "Scanning satellites...";
        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const req = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                const data = await req.json();
                const w = data.current_weather;
                askAI(`Local weather data: Temp ${w.temperature}C, Wind ${w.windspeed}kmh. Give a report as Spot 73. Convert to Fahrenheit if you want.`);
            } catch(e) { askAI("I cannot access the weather satellites. It is probably raining anyway."); }
        }, () => askAI("Location access denied."));
    }

    // --- 4. ANIMATION ---
    let currentMood = 'neutral'; 
    function blink() {
        if (isTalking || isEating) return; // Don't blink if busy
        const prev = headEl.style.backgroundImage;
        headEl.style.backgroundImage = SPRITES.blink;
        setTimeout(() => { if(!isTalking && !isEating) headEl.style.backgroundImage = prev; }, 150);
        setTimeout(blink, Math.random() * 3000 + 3000);
    }
    blink();

    function talkLoop() {
        if (!isTalking || isEating) return;
        let mouthOpen = (headEl.style.transform.includes('-4px')); // Simple toggle check
        mouthOpen = !mouthOpen;
        
        let useTalkSprite = (currentMood === 'neutral' || currentMood === 'happy');
        if (useTalkSprite) {
            headEl.style.backgroundImage = mouthOpen ? SPRITES.talk : (SPRITES[currentMood] || SPRITES.neutral);
            headEl.style.transform = mouthOpen ? "translateY(-4px)" : "translateY(0px)";
        } else {
            headEl.style.backgroundImage = SPRITES[currentMood];
            headEl.style.transform = mouthOpen ? "translateY(-5px) rotate(-2deg)" : "translateY(0px) rotate(0deg)";
        }
        talkTimer = setTimeout(talkLoop, Math.random() * 150 + 50);
    }

    function startAnim() { if(!isTalking && !isEating) { isTalking = true; talkLoop(); } }
    function stopAnim() { isTalking = false; clearTimeout(talkTimer); headEl.style.backgroundImage = SPRITES.neutral; headEl.style.transform = "translateY(0px)"; }

    // --- 5. AUDIO & LOGIC ---
    function silence() { window.speechSynthesis.cancel(); stopAnim(); }
    function manualStop() { silence(); bubble.innerText = "Output terminated."; }

    async function speak(text) {
        silence(); 
        isMeowing = text.toLowerCase().includes("meow");
        if (CONFIG.ttsProvider === 'browser') {
            const u = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const selected = voices.find(v => v.name === CONFIG.browserVoiceName);
            if (selected) u.voice = selected;
            u.pitch = CONFIG.pitch; u.rate = CONFIG.rate;
            u.onstart = startAnim; 
            u.onboundary = (e) => {
                if (isMeowing && (text.length - e.charIndex) < 7) {
                    isTalking = false; clearTimeout(talkTimer);
                    headEl.style.backgroundImage = SPRITES.meow; headEl.style.transform = "translateY(-5px)";
                }
            };
            u.onend = () => { isMeowing ? setTimeout(stopAnim, 300) : stopAnim(); };
            window.speechSynthesis.speak(u);
        } else { startAnim(); setTimeout(stopAnim, text.length * 80); }
    }

    async function askAI(userText) {
        if(isEating) return; // Don't talk with mouth full
        chatHistory.push({ role: "user", content: userText });
        if (chatHistory.length > 11) chatHistory.splice(1, 1);
        bubble.innerText = "Thinking...";
        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${CONFIG.apiKey}`, "Content-Type": "application/json", "HTTP-Referer": "http://localhost" },
                body: JSON.stringify({ model: CONFIG.modelId, messages: chatHistory })
            });
            if (!response.ok) { 
                const t = await response.text(); 
                let msg = "API Error";
                try { msg = JSON.parse(t).error.message; } catch(e){}
                throw new Error(msg); 
            }
            const data = await response.json();
            const aiText = data.choices[0].message.content;
            chatHistory.push({ role: "assistant", content: aiText });
            
            currentMood = 'neutral';
            ['angry','happy','surprised','sad','dizzy','smug','wink','laugh','suspicious'].forEach(e => { if(aiText.toLowerCase().includes(`[${e}]`)) currentMood = e; });
            const spoken = aiText.replace(/\[.*?\]/g, '').trim();
            bubble.innerText = spoken;
            headEl.style.backgroundImage = SPRITES[currentMood] || SPRITES.neutral;
            speak(spoken);
        } catch (e) { bubble.innerText = "⚠️ " + e.message; log("Error: "+e.message); stopAnim(); }
    }

    function handleKeyPress(e) { if(e.key === 'Enter') sendInput(); }
    function sendInput() { const el = document.getElementById('text-input'); const txt = el.value.trim(); if(!txt) return; el.value = ""; askAI(txt); }
    
    function populateVoiceList() {
        const voices = window.speechSynthesis.getVoices();
        const select = document.getElementById('set-browser-voice');
        select.innerHTML = '';
        voices.forEach(v => {
            const opt = document.createElement('option');
            opt.textContent = `${v.name} (${v.lang})`;
            opt.value = v.name;
            if(v.name === CONFIG.browserVoiceName) opt.selected = true;
            select.appendChild(opt);
        });
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoiceList;
    function updateVoiceOptions() { } 

    function startListening() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(Rec) {
            const r = new Rec();
            r.lang = 'en-US';
            r.start();
            bubble.innerText = "Listening...";
            r.onresult = (e) => askAI(e.results[0][0].transcript);
        } else { alert("Mic needs Chrome."); }
    }

    loadSettings();
</script>
